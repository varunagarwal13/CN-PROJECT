version: "3.8"

networks:
  edge_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
          gateway: 10.0.10.1

  ssh_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.0.20.0/24
          gateway: 10.0.20.1

  web_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.0.30.0/24
          gateway: 10.0.30.1

  services_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.0.40.0/24
          gateway: 10.0.40.1

  monitor_net:
    driver: bridge
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 10.0.50.0/24
          gateway: 10.0.50.1

services:
  edge-gateway:
    build:
      context: ./edge-gateway
      dockerfile: Dockerfile
    container_name: netmirage-edge
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      edge_net:
        ipv4_address: 10.0.10.42
      ssh_net:
        ipv4_address: 10.0.20.254
      web_net:
        ipv4_address: 10.0.30.254
      services_net:
        ipv4_address: 10.0.40.254
      monitor_net:
        ipv4_address: 10.0.50.254
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  cowrie-ssh-lure:
    build:
      context: ./cowrie-ssh-lure
      dockerfile: Dockerfile
    container_name: netmirage-ssh-lure
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      ssh_net:
        ipv4_address: 10.0.20.10
    ports:
      - "22:22"
      - "2222:2222"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web-lure:
    build:
      context: ./web-lure
      dockerfile: Dockerfile
    container_name: netmirage-web-lure
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      web_net:
        ipv4_address: 10.0.30.10
    ports:
      - "80:80"
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  dns-smtp-lure:
    build:
      context: ./dns-smtp-lure
      dockerfile: Dockerfile
    container_name: netmirage-services-lure
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      services_net:
        ipv4_address: 10.0.40.10
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "25:25"
      - "2525:2525"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  telemetry-collector:
    build:
      context: ./telemetry-collector
      dockerfile: Dockerfile
    container_name: netmirage-telemetry
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: false
    tmpfs:
      - /tmp:rw,noexec,nosuid
    networks:
      monitor_net:
        ipv4_address: 10.0.50.10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
